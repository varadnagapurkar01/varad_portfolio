<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        /* ═══════════════════════════════════════════════════════════════════════════════
           PERSONALITY ENTRY ANIMATION - Cinematic Krishna Logo Intro
           ═══════════════════════════════════════════════════════════════════════════════ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #07070a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Main animation container */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #07070a 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        /* Krishna logo container */
        .logo-container {
            position: relative;
            width: 300px;
            height: 300px;
            animation: logoZoom 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Logo image */
        .krishna-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(255, 204, 0, 0.6));
        }

        /* Dramatic zoom animation */
        @keyframes logoZoom {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            40% {
                transform: scale(1.2) rotate(5deg);
                opacity: 1;
            }
            60% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Shatter particles */
        .particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffcc00;
            opacity: 0;
            pointer-events: none;
        }

        /* Shatter animation trigger class */
        .logo-container.shatter .krishna-logo {
            animation: logoShatter 0.8s ease-out forwards;
        }

        @keyframes logoShatter {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: drop-shadow(0 0 40px rgba(255, 204, 0, 0.6));
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
                filter: drop-shadow(0 0 80px rgba(255, 204, 0, 1)) brightness(1.5);
            }
            100% {
                transform: scale(2);
                opacity: 0;
                filter: drop-shadow(0 0 120px rgba(255, 204, 0, 0)) brightness(2);
            }
        }

        /* Particle burst animation */
        .logo-container.shatter .particle {
            animation: particleBurst 1s ease-out forwards;
        }

        @keyframes particleBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(720deg);
            }
        }

        /* Glow ring effect */
        .glow-ring {
            position: absolute;
            inset: -50px;
            border: 3px solid rgba(255, 204, 0, 0.4);
            border-radius: 50%;
            animation: ringPulse 2s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════════════════════════
         INTRO OVERLAY -  Logo Animation
         ═══════════════════════════════════════════════════════════════════════════════ -->
    <div id="intro-overlay">
        <div class="logo-container" id="logoContainer">
            <div class="glow-ring"></div>
            <img loading="lazy" src="../varad IMAGES/krishna -group-logo.png" alt="Krishna Group" class="krishna-logo" id="krishnaLogo">
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════════════════════════
           PERSONALITY INTRO ANIMATION LOGIC
           ═══════════════════════════════════════════════════════════════════════════════ */
        
        const logoContainer = document.getElementById('logoContainer');
        const overlay = document.getElementById('intro-overlay');

        // Create shatter particles
        function createParticles() {
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random direction for each particle
                const angle = (Math.PI * 2 * i) / particleCount;
                const distance = 200 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.transform = 'translate(-50%, -50%)';
                
                logoContainer.appendChild(particle);
            }
        }

        // Animation sequence
        setTimeout(() => {
            createParticles();
            logoContainer.classList.add('shatter');
        }, 1200); // Hold for 1.2 seconds before shatter

        // Transition to personality page
        setTimeout(() => {
            overlay.style.transition = 'opacity 0.4s ease';
            overlay.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'personality.html';
            }, 400);
        }, 2000); // Total animation: ~1.2s hold + 0.8s shatter + 0.4s fade ≈ 2s
    </script>
</body>
</html>
