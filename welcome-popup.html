<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Experience</title>
  <link rel="stylesheet" href="css/welcome-popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- CINEMATIC WELCOME OVERLAY -->
  <div id="welcomeOverlay">
    
    <!-- Animated Galaxy Canvas Background -->
    <canvas id="galaxyCanvas"></canvas>

    <!-- Welcome Input Form -->
    <div class="welcome-content">
      <div class="welcome-prompt">
        <span class="typewriter-text"></span>
      </div>

      <div class="name-input-container">
        <input 
          type="text" 
          id="nameInput" 
          placeholder="Type your name..."
          autocomplete="off"
          spellcheck="false"
        >
      </div>

      <div class="enter-instruction">
        Press Enter to continue
      </div>
    </div>

    <!-- Welcome Reveal Screen (shown after name entry) -->
    <div class="welcome-reveal">
      <div class="welcome-message">Welcome,</div>
      <div class="visitor-name"></div>
      <div class="welcome-tagline">Your journey begins now</div>
    </div>

  </div>

  <!-- Your Portfolio Content Goes Here -->
  <div style="padding: 100px; text-align: center; font-family: 'Poppins', sans-serif;">
    <h1>Your Portfolio Content</h1>
    <p>This is where your actual portfolio will be displayed after the welcome animation.</p>
    <button onclick="clearWelcomeData()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">
      Clear Welcome Data (for testing)
    </button>
  </div>

  <script src="js/welcome-popup.js"></script>
</body>
</html>
