<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Dashboard - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 1rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .visitors-table {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow-x: auto;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .table-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      color: #333;
    }

    .export-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .export-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f8f9fa;
    }

    th {
      padding: 15px;
      text-align: left;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      color: #666;
    }

    tbody tr:hover {
      background: #f8f9fa;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 1.1rem;
    }

    .error {
      background: #ff6b6b;
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state svg {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .refresh-btn {
      background: transparent;
      border: 2px solid white;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-left: 10px;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      background: white;
      color: #667eea;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .stat-number {
        font-size: 2.5rem;
      }

      .table-header {
        flex-direction: column;
        gap: 15px;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 10px;
      }
    }

    /* Dashboard Layout Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    @media (max-width: 992px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Popularity Cards & Items */
    .popularity-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .popularity-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .popularity-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .popularity-name {
      font-weight: 600;
      color: #333;
      text-transform: capitalize;
    }

    .popularity-count {
      color: #667eea;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
    }

    .popularity-bar-bg {
      background: #f1f3f9;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .popularity-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 4px;
      width: 0%;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Visitor Dashboard</h1>
      <p>Track everyone who's visited your portfolio</p>
      <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
    </div>

    <div id="errorMessage"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="totalVisitors">-</div>
        <div class="stat-label">Total Visitors</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="todayVisitors">-</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="thisWeekVisitors">-</div>
        <div class="stat-label">This Week</div>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- Recent Visitors -->
      <div class="visitors-table">
        <div class="table-header">
          <h2>Recent Visitors</h2>
          <button class="export-btn" onclick="exportData()">📥 Export to JSON</button>
        </div>

        <div id="tableContent">
          <div class="loading">Loading visitor data...</div>
        </div>
      </div>

      <!-- Section Popularity -->
      <div class="stat-card" style="text-align: left; padding: 30px;">
        <h2 style="font-family: 'Montserrat', sans-serif; font-size: 1.8rem; color: #333; margin-bottom: 25px;">Section Views</h2>
        <div id="popularityContent">
          <div class="loading" style="padding: 20px 0; text-align: center;">Loading page views...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    // Load data on page load
    document.addEventListener('DOMContentLoaded', loadData);

    async function loadData() {
      try {
        // Clear error message
        document.getElementById('errorMessage').innerHTML = '';

        // Fetch comprehensive stats
        const statsResponse = await fetch(`${API_BASE}/stats`);
        const statsData = await statsResponse.json();
        
        if (statsData.success) {
          document.getElementById('totalVisitors').textContent = statsData.totalVisitors;
          document.getElementById('todayVisitors').textContent = statsData.todayVisitors;
          document.getElementById('thisWeekVisitors').textContent = statsData.weekVisitors;
          displayPopularity(statsData.pageViews);
        }

        // Fetch all visitors
        const visitorsResponse = await fetch(`${API_BASE}/visitors`);
        const visitorsData = await visitorsResponse.json();

        if (visitorsData.success) {
          displayVisitors(visitorsData.visitors);
        }

      } catch (error) {
        console.error('Error loading data:', error);
        showError('Failed to load visitor data. Make sure the backend server is running (npm start).');
        document.getElementById('tableContent').innerHTML = `
          <div class="empty-state">
            <p>⚠️ Cannot connect to backend server</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">Run <code>npm start</code> in your project folder</p>
          </div>
        `;
        document.getElementById('popularityContent').innerHTML = `
          <div style="text-align: center; color: #999; padding: 20px;">
            Connection Offline
          </div>
        `;
      }
    }

    function displayVisitors(visitors) {
      const tableContent = document.getElementById('tableContent');

      if (visitors.length === 0) {
        tableContent.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <h3>No visitors yet</h3>
            <p>Visitor data will appear here once someone enters their name</p>
          </div>
        `;
        return;
      }

      const tableHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Date & Time</th>
              <th>Browser</th>
            </tr>
          </thead>
          <tbody>
            ${visitors.map((visitor, index) => `
              <tr>
                <td>${index + 1}</td>
                <td><strong>${escapeHtml(visitor.name)}</strong></td>
                <td>${formatDate(visitor.created_at)}</td>
                <td>${getBrowserName(visitor.user_agent)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      tableContent.innerHTML = tableHTML;
    }

    function displayPopularity(pageViews) {
      const popularityContent = document.getElementById('popularityContent');

      if (!pageViews || pageViews.length === 0) {
        popularityContent.innerHTML = `
          <div style="text-align: center; color: #999; padding: 40px 0;">
            No views recorded yet
          </div>
        `;
        return;
      }

      // Find the maximum views value to calculate relative percentages for visual bars
      const maxViews = Math.max(...pageViews.map(p => p.views), 1);

      // Mapping technical names to beautiful labels
      const pageNames = {
        'home': '🏠 Home / Index',
        'cricket': '🏏 Cricket Section',
        'personality': '🧠 Personality Dev',
        'devops': '⚙️ DevOps Section',
        'certifications': '🏅 Certifications',
        'projects': '🚀 Projects Page',
        'documents': '📄 Documents Page'
      };

      const popularityHTML = `
        <div class="popularity-list">
          ${pageViews.map(pageData => {
            const pct = Math.round((pageData.views / maxViews) * 100);
            const displayName = pageNames[pageData.page] || escapeHtml(pageData.page);
            return `
              <div class="popularity-item">
                <div class="popularity-info">
                  <span class="popularity-name">${displayName}</span>
                  <span class="popularity-count">${pageData.views} views</span>
                </div>
                <div class="popularity-bar-bg">
                  <div class="popularity-bar-fill" style="width: ${pct}%"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      popularityContent.innerHTML = popularityHTML;
    }

    async function exportData() {
      try {
        const response = await fetch(`${API_BASE}/export-visitors`);
        const data = await response.json();

        if (data.success) {
          alert(`✅ Data exported successfully!\n\nFile: ${data.file}\nTotal visitors: ${data.count}\n\nCheck your project folder for the JSON file.`);
        }
      } catch (error) {
        console.error('Error exporting data:', error);
        alert('❌ Failed to export data. Make sure the backend server is running.');
      }
    }

    function showError(message) {
      document.getElementById('errorMessage').innerHTML = `
        <div class="error">${message}</div>
      `;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const options = { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      };
      return date.toLocaleDateString('en-US', options);
    }

    function getBrowserName(userAgent) {
      if (!userAgent) return 'Unknown';
      
      if (userAgent.includes('Chrome')) return '🌐 Chrome';
      if (userAgent.includes('Firefox')) return '🦊 Firefox';
      if (userAgent.includes('Safari')) return '🧭 Safari';
      if (userAgent.includes('Edge')) return '🌊 Edge';
      if (userAgent.includes('Opera')) return '🎭 Opera';
      
      return '🌐 Browser';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
