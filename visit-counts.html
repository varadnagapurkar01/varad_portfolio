<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Counts</title>
    <style>
        body {
            font-family: monospace, sans-serif;
            background: #fff;
            color: #000;
            padding: 2rem;
            margin: 0;
        }
        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: inline-block;
        }
        table {
            width: 100%;
            max-width: 500px;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        th {
            font-weight: bold;
            text-transform: uppercase;
        }
        .last-updated {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Visit Counts</h1>

    <table>
        <thead>
            <tr>
                <th>Page Name</th>
                <th>Total Visits</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="2">Loading...</td>
            </tr>
        </tbody>
    </table>

    <div class="last-updated" id="lastUpdated"></div>

    <script>
        async function fetchCounts() {
            try {
                const response = await fetch('http://localhost:3000/api/counts');
                const data = await response.json();
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2">No visits recorded yet.</td></tr>';
                } else {
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.page_name}</td>
                            <td>${row.count}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                
                document.getElementById('lastUpdated').textContent = "Last updated: " + new Date().toLocaleTimeString();
            } catch (error) {
                console.error(error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="2">Error connecting to database. Is the server running?</td></tr>';
            }
        }

        // Fetch immediately on load
        fetchCounts();

        // Auto-refresh every 60 seconds (1 minute)
        setInterval(fetchCounts, 60000);
    </script>

</body>
</html>
